plugins {
    id "com.android.application"
}

android {
    namespace "org.voleyos.global"
    compileSdk 35

    defaultConfig {
        applicationId "org.voleyos.global"
        minSdk 24
        targetSdk 35
        versionCode 900
        versionName "9.0.0"
    }

    // Android's asset merger ignores directories whose name starts with an underscore
    // (<dir>_* in its default ignore pattern), which silently dropped Next.js `_next`
    // chunks and left the WebView with HTML but no JavaScript. Keep the other default
    // exclusions, but drop that directory rule.
    androidResources {
        ignoreAssetsPatterns.addAll(
                "!.svn", "!.git", "!.ds_store", "!*.scc", ".*",
                "!CVS", "!thumbs.db", "!picasa.ini", "!*~")
    }

    def keystorePath = System.getenv("VOLEYOS_KEYSTORE")
    def hasReleaseKeystore = keystorePath != null && !keystorePath.trim().isEmpty()
    if (hasReleaseKeystore) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storeType "PKCS12"
                storePassword System.getenv("VOLEYOS_KEYSTORE_PASSWORD") ?: "voleyos-ci"
                keyAlias System.getenv("VOLEYOS_KEY_ALIAS") ?: "voleyos"
                keyPassword System.getenv("VOLEYOS_KEY_PASSWORD") ?: "voleyos-ci"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Never emit an unsigned APK: Android rejects those at install time.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The WebView loads file:///android_asset/index.html: the static export MUST sit
// at the ROOT of src/main/assets. If CI (or a local build) has a fresh
// frontend/out, auto-copy it so assembleRelease can never ship without a shell.
def frontendOut = file("../../frontend/out")
def assetsIndex = file("src/main/assets/index.html")
tasks.register("verifyWebAssets") {
    doLast {
        if (!assetsIndex.exists() && frontendOut.file("index.html").exists()) {
            copy {
                from frontendOut
                into file("src/main/assets")
            }
        }
        if (!assetsIndex.exists()) {
            throw new GradleException(
                "src/main/assets/index.html missing. Build the frontend first: " +
                "cd frontend && VOLEYOS_STATIC_EXPORT=true npm run build")
        }
        logger.lifecycle("web assets OK: " + assetsIndex)
    }
}
afterEvaluate {
    tasks.named("preBuild").dependsOn(tasks.named("verifyWebAssets"))
}

// Pure Android SDK shell: zero androidx / Kotlin dependencies, so AAR metadata and
// compileSdk clashes can never break assembleRelease again.
dependencies {
}
