plugins {
    id "com.android.application"
}

android {
    namespace "org.voleyos.global"
    compileSdk 35

    defaultConfig {
        applicationId "org.voleyos.global"
        minSdk 24
        targetSdk 35
        versionCode 800
        versionName "8.0.0"
    }

    // Android's asset merger ignores directories whose name starts with an underscore
    // (<dir>_* in its default ignore pattern), which silently dropped Next.js `_next`
    // chunks and left the WebView with HTML but no JavaScript. Keep the other default
    // exclusions, but drop that directory rule.
    androidResources {
        ignoreAssetsPatterns.addAll(
                "!.svn", "!.git", "!.ds_store", "!*.scc", ".*",
                "!CVS", "!thumbs.db", "!picasa.ini", "!*~")
    }

    def keystorePath = System.getenv("VOLEYOS_KEYSTORE")
    def hasReleaseKeystore = keystorePath != null && !keystorePath.trim().isEmpty()
    if (hasReleaseKeystore) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storeType "PKCS12"
                storePassword System.getenv("VOLEYOS_KEYSTORE_PASSWORD") ?: "voleyos-ci"
                keyAlias System.getenv("VOLEYOS_KEY_ALIAS") ?: "voleyos"
                keyPassword System.getenv("VOLEYOS_KEY_PASSWORD") ?: "voleyos-ci"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Never emit an unsigned APK: Android rejects those at install time.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.9.0"
    implementation "androidx.webkit:webkit:1.12.1"
}

// Kotlin stdlib 1.8+ already merges the jdk7/jdk8 extension content; keeping the
// old variants on the classpath triggers duplicate-class failures at package time.
configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}
