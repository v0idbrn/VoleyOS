name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Static export (public, paywall on)
        working-directory: frontend
        env:
          VOLEYOS_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BUILD_TARGET: cloud
          NEXT_PUBLIC_DEV_UNLOCK: "false"
          NEXT_PUBLIC_CREATOR_KEY_SHA256: ${{ vars.CREATOR_KEY_SHA256 }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Check public static export
        run: |
          test -f frontend/out/index.html
          test -d frontend/out/_next
          echo "public static files: $(find frontend/out -type f | wc -l)"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Copy public build into APK assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -R frontend/out/. android/app/src/main/assets/
          test -f android/app/src/main/assets/index.html || (echo "ERROR: assets/index.html missing!" && exit 1)
          test -d android/app/src/main/assets/_next
          echo "public assets: $(find android/app/src/main/assets -type f | wc -l)"

      - name: Assert assets/index.html exists before Gradle
        run: |
          test -f android/app/src/main/assets/index.html || (echo "ERROR: assets/index.html missing!" && exit 1)
          echo "assets/index.html OK: $(wc -c < android/app/src/main/assets/index.html) bytes"

      - name: Provision release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE=android/release.keystore
          rm -f "$KEYSTORE"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using persisted release keystore from repository secrets."
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            test -s "$KEYSTORE"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 missing; generating ephemeral keystore (forks only)."
            KEYPASS="${ANDROID_KEYSTORE_PASS:-voleyos-ci}"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -alias "${ANDROID_KEY_ALIAS:-voleyos}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYPASS" \
              -keypass "$KEYPASS" \
              -dname "CN=VoleyOS Global, OU=Mobile, O=VoleyOS, L=Montevideo, C=UY"
          fi
          ls -l "$KEYSTORE"

      - name: Build public release APK
        working-directory: android
        env:
          VOLEYOS_KEYSTORE: ${{ github.workspace }}/android/release.keystore
          VOLEYOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || 'voleyos-ci' }}
          VOLEYOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'voleyos' }}
          VOLEYOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || 'voleyos-ci' }}
        run: gradle assembleRelease --no-daemon

      - name: Stage public APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk voleyos-universal.apk
          ls -lh voleyos-universal.apk

      - name: Static export (creator, unlocked)
        working-directory: frontend
        env:
          VOLEYOS_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BUILD_TARGET: cloud
          NEXT_PUBLIC_DEV_UNLOCK: "true"
          NEXT_PUBLIC_CREATOR_KEY_SHA256: ${{ vars.CREATOR_KEY_SHA256 }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Check creator static export
        run: |
          test -f frontend/out/index.html
          test -d frontend/out/_next
          echo "creator static files: $(find frontend/out -type f | wc -l)"

      - name: Copy creator build into APK assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -R frontend/out/. android/app/src/main/assets/
          test -f android/app/src/main/assets/index.html || (echo "ERROR: assets/index.html missing!" && exit 1)
          test -d android/app/src/main/assets/_next
          echo "creator assets: $(find android/app/src/main/assets -type f | wc -l)"

      - name: Assert creator assets/index.html exists before Gradle
        run: |
          test -f android/app/src/main/assets/index.html || (echo "ERROR: assets/index.html missing!" && exit 1)
          echo "assets/index.html OK: $(wc -c < android/app/src/main/assets/index.html) bytes"

      - name: Build creator release APK
        working-directory: android
        env:
          VOLEYOS_KEYSTORE: ${{ github.workspace }}/android/release.keystore
          VOLEYOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || 'voleyos-ci' }}
          VOLEYOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'voleyos' }}
          VOLEYOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS || 'voleyos-ci' }}
        run: gradle clean assembleRelease --no-daemon

      - name: Stage creator APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk voleyos-creator-unlocked.apk
          ls -lh voleyos-creator-unlocked.apk

      - name: Verify APKs, payload and signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          test -x "$APKSIGNER"
          test -x "$AAPT2"
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          for APK in voleyos-universal.apk voleyos-creator-unlocked.apk; do
            test -f "$APK"
            "$APKSIGNER" verify --verbose "$APK"
            fingerprint=$("$APKSIGNER" verify --print-certs "$APK" \
              | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            echo "$APK signing certificate SHA-256: $fingerprint"
            if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
              test "$fingerprint" = "d11a1e87ee86f9046bd150188222c44f20afefea5e9668be6511c6f81501acb2"
            fi
            unzip -Z1 "$APK" | grep -q "^assets/index.html$"
            chunks=$(unzip -Z1 "$APK" | grep -cE "^assets/_next/static/chunks/.+[.]js$")
            echo "$APK Next.js chunks: $chunks"
            test "$chunks" -ge 5
          done
          echo "=== Creator APK badging (aapt2) ==="
          "$AAPT2" dump badging voleyos-creator-unlocked.apk | head -n 30
          if cmp -s voleyos-universal.apk voleyos-creator-unlocked.apk; then
            echo "::error::Creator APK is identical to the public APK; the DEV_UNLOCK build flag did not change the bundle."
            exit 1
          fi

      - name: Upload public APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voleyos-universal-apk
          path: voleyos-universal.apk
          if-no-files-found: error

      - name: Upload creator APK (private, expires in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: voleyos-creator-unlocked-apk
          path: voleyos-creator-unlocked.apk
          retention-days: 1
          if-no-files-found: error

      - name: Attach public APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: voleyos-universal.apk
          generate_release_notes: true
