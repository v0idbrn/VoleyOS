name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Static export
        working-directory: frontend
        env:
          VOLEYOS_STATIC_EXPORT: "true"
          NEXT_PUBLIC_BUILD_TARGET: fdroid
        run: npm run build

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Copy web build into APK assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -R frontend/out/. android/app/src/main/assets/public/

      - name: Generate release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VOLEYOS_KEYSTORE_PASSWORD || 'voleyos-ci' }}
        run: |
          keytool -genkeypair -v \
            -keystore android/release.keystore \
            -alias voleyos \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=VoleyOS Global, OU=Mobile, O=VoleyOS, L=Montevideo, C=UY"

      - name: Build release APK
        working-directory: android
        env:
          VOLEYOS_KEYSTORE: ${{ github.workspace }}/android/release.keystore
          VOLEYOS_KEYSTORE_PASSWORD: ${{ secrets.VOLEYOS_KEYSTORE_PASSWORD || 'voleyos-ci' }}
          VOLEYOS_KEY_ALIAS: voleyos
          VOLEYOS_KEY_PASSWORD: ${{ secrets.VOLEYOS_KEYSTORE_PASSWORD || 'voleyos-ci' }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk voleyos-universal.apk
          ls -lh voleyos-universal.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voleyos-universal-apk
          path: voleyos-universal.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: voleyos-universal.apk
          generate_release_notes: true
