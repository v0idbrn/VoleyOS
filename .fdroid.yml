# VolleyOS — in-source .fdroid.yml hints for fdroid-based scanners.
# The canonical package metadata lives in fdroid/org.voleyos.global.yml and the
# store copy in fastlane/metadata/android (consumed directly by IzzyOnDroid).
# Version detection: versionCode/versionName live in android/app/build.gradle.
UpdateCheckData: android/app/build.gradle|versionCode (\d+)|.|versionName "(.+)"
