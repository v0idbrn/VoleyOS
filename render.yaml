services:
  - type: web
    name: volleyos-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/deep
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true

  - type: web
    name: volleyos-web
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NEXT_PUBLIC_BUILD_TARGET
        value: cloud
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
